[project]
name = "kairos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
product = [
    "httpx",
    "numpy",
    "pillow",
    "opencv-python-headless",
    "scikit-image",
    "rapidocr",
    "onnxruntime",
]
gpu = [  # gate models (BiRefNet, DINOv2); BiRefNet remote code needs timm, kornia, einops
    "torch",
    "torchvision",
    "transformers",
    "timm",
    "kornia",
    "einops",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false  # flat layout: run from the repo root, each folder imports as a package

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "gpu: needs real models",
    "api: calls OpenRouter",
]
addopts = "-m 'not gpu and not api'"
